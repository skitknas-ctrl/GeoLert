name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (foss)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PbuildNumber=${{ github.run_number }} assembleFossRelease
          cp app/build/outputs/apk/foss/release/app-foss-release.apk GeoLert.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoLert
          path: GeoLert.apk

      # One release per build (v0.1.<n>) so Obtainium sees every build as a new version.
      # The three latest are kept, older ones are deleted.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v0.1.${{ github.run_number }}
        run: |
          for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v0\.[0-9]+\.[0-9]+$' | sort -t. -k2,2n -k3,3n -r | tail -n +3 || true); do
            gh release delete "$old" --cleanup-tag --yes || true
          done
          gh release create "$VERSION" GeoLert.apk \
            --latest \
            --title "GeoLert $VERSION" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}."
